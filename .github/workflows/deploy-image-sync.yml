---
name: "Deploy image sync"

on:
  # Trigger on published releases. These are only releases in the "official" channel.
  # IE semantic releases with version changes.
  # Release configuration is in `.semrel.yaml`
  # Release is governed and executed by semrel
  # release:
  #   types:
  #     - released
  push:
    branches:
      - main
  pull_request:
    paths:
      - "deploy/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    needs:
      - release
    uses: $/.github/workflows/deploy.yml
    with:
      dir: "deploy/image-sync"
      tags: "docker,image-sync,accounting"
      env: "image-sync"
      hostname: "image-sync.ops.fedcloud.eu"
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      ANSIBLE_SECRETS: ${{ secrets.ANSIBLE_SECRETS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
