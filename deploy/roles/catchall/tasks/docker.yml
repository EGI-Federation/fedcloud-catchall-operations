---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present
    update_cache: true

- name: Add docker repo
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: stable
    architectures: amd64
    sgined_by: https://download.docker.com/linux/ubuntu/gpg

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Ensure docker config dir is present
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "775"
  notify:
    - Restart docker

- name: Configure docker
  ansible.builtin.copy:
    # this is very CESNET-MCC specific, may be better to move as configurable
    content: |
      {
        "mtu": 1442,
        "exec-opts": ["native.cgroupdriver=systemd"],
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m"
        },
        "storage-driver": "overlay2"
      }
    dest: /etc/docker/daemon.json
    mode: "660"
  notify:
    - Restart docker
